<svg aria-label="크기 8인 링 버퍼에서 tail 6, head 10일 때 슬롯 6, 7, 0, 1이 사용 중인 상태" role="img" viewbox="0 0 640 216" xmlns="http://www.w3.org/2000/svg"><text class="ts" x="55" y="40">슬롯 0</text><rect class="boxn" height="36" rx="3" width="70" x="20" y="52"></rect><text class="t tc" x="55.0" y="75.0">데이터</text><text class="ts" x="130" y="40">슬롯 1</text><rect class="boxn" height="36" rx="3" width="70" x="95" y="52"></rect><text class="t tc" x="130.0" y="75.0">데이터</text><text class="ts" x="205" y="40">슬롯 2</text><rect class="boxd" height="36" rx="3" width="70" x="170" y="52"></rect><text class="ts" x="205" y="75">빈 칸</text><text class="ts" x="280" y="40">슬롯 3</text><rect class="boxd" height="36" rx="3" width="70" x="245" y="52"></rect><text class="ts" x="280" y="75">빈 칸</text><text class="ts" x="355" y="40">슬롯 4</text><rect class="boxd" height="36" rx="3" width="70" x="320" y="52"></rect><text class="ts" x="355" y="75">빈 칸</text><text class="ts" x="430" y="40">슬롯 5</text><rect class="boxd" height="36" rx="3" width="70" x="395" y="52"></rect><text class="ts" x="430" y="75">빈 칸</text><text class="ts" x="505" y="40">슬롯 6</text><rect class="boxn" height="36" rx="3" width="70" x="470" y="52"></rect><text class="t tc" x="505.0" y="75.0">데이터</text><text class="ts" x="580" y="40">슬롯 7</text><rect class="boxn" height="36" rx="3" width="70" x="545" y="52"></rect><text class="t tc" x="580.0" y="75.0">데이터</text><line class="lb" x1="505" x2="505" y1="128" y2="100"></line><polygon class="ab" points="500,102 510,102 505,92"></polygon><text class="ts" x="505" y="146">tail = 6</text><text class="ts" x="505" y="162">다음에 읽을 곳</text><line class="lb" x1="205" x2="205" y1="128" y2="100"></line><polygon class="ab" points="200,102 210,102 205,92"></polygon><text class="ts" x="205" y="146">head = 10</text><text class="ts" x="205" y="162">다음에 쓸 곳 (10 &amp; 7 = 2)</text><text class="ts" x="320" y="202">개수 = head − tail = 4, 위치 = 인덱스 &amp; 7</text></svg>
