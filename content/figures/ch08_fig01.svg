<svg aria-label="32비트 틱 카운터가 되감기는 구간에서 start와 now 사이의 경과 계산" role="img" viewbox="0 0 640 214" xmlns="http://www.w3.org/2000/svg"><rect class="boxg" height="30" rx="3" width="600" x="20" y="100"></rect><rect class="boxn" height="30" rx="3" width="30" x="590" y="100"></rect><rect class="boxn" height="30" rx="3" width="30" x="20" y="100"></rect><text class="ts" x="605" y="120">+16</text><text class="ts" x="35" y="120">+16</text><path class="lb" d="M605,96 C605,24 35,24 35,90"></path><polygon class="ab" points="30,82 35,94 40,82"></polygon><text class="tb" x="320" y="34">0xFFFFFFFF 다음은 0으로 되감김</text><line class="ln" x1="590" x2="590" y1="130" y2="142"></line><line class="ln" x1="50" x2="50" y1="130" y2="142"></line><text class="ta" x="620" y="158">start = 0xFFFFFFF0</text><text class="tl" x="20" y="158">now = 0x00000010</text><text class="ts" x="320" y="198">now - start = 0x00000010 - 0xFFFFFFF0 = 0x20 (mod 2^32)</text></svg>
